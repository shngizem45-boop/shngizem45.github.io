<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizem'in Ders Programı</title>
    <style>
        * {
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <h1>Gizem'in Ders Programı</h1>
    <h2>Bilgisayar Programcılığı</h2>

    <!-- Ders Programı Tablosu -->
    <table>
        <thead>
            <tr>
                <th>Saat</th>
                <th>Pazartesi</th>
                <th>Salı</th>
                <th>Çarşamba</th>
                <th>Perşembe</th>
                <th>Cuma</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>09:00 - 10:00</td>
                <td>Programlama Temelleri</td>
                <td>Ağ Temelleri</td>
                <td>-</td>
                <td>Veritabanı</td>
                <td>-</td>
            </tr>
            <!-- Diğer ders saatlerini buraya <tr>...</tr> ekleyerek çoğaltabilirsiniz -->
        </tbody>
    </table>

</body>
</html>
